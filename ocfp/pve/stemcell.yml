---
# PVE bloc invariant: ubuntu-noble only (the OCFP PVE CPI is built and tested
# against noble; jammy is unsupported). The kit base overlay (overlay/base.yml)
# also defaults params.stemcell_os to ubuntu-noble, so this file no longer
# changes the outcome on its own. It stays because the invariant is a property
# of PVE rather than of the base default: if the base overlay ever moves off
# noble, or an environment pins jammy for a non-PVE reason, PVE still has to
# land on noble to match the noble-compiled releases and the CPI.
#
# No version pin: base.yml defaults params.stemcell_version to "latest", which
# resolves to the newest noble uploaded to the deploying director. The GCS
# noble-compiled releases pair with any same-OS stemcell >= their compile
# version, so a hard pin here only desynchronises from whatever the director
# actually has (pin per-env via params.stemcell_version if ever needed).
params:
  stemcell_os: ubuntu-noble
