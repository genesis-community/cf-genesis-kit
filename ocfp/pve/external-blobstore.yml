---
# OCFP layer for the PVE external blobstore. Sources the endpoint, region, and
# credentials from the bloc's vault tree, then wires storage-cli onto all three
# cloud_controller jobs.
#
# Why the wiring lives here rather than in cf-deployment's own ops file: as of
# cf-deployment v59.0.0, operations/use-external-blobstore.yml sets the four
# directory keys and nothing else, and v60.5.0 ships a use-s3-blobstore.yml
# that expects variables named blobstore_access_key_id, blobstore_secret_access_key,
# and aws_region, none of which match the names this kit populates. That ops
# file also has no way to express a custom host, port, or TLS setting, which an
# in-bloc RustFS needs and AWS does not. Rather than rename our variables to
# suit it and then patch the gaps back in, we write the twelve bucket configs
# directly and keep the whole story in one file.
#
# The four buckets are unchanged from the fog era, so this is a client swap
# rather than a data migration; droplets and packages already in RustFS stay
# where they are.
#
# Property names come from capi's jobs/cloud_controller_ng/templates/
# storage_cli_config_*.json.erb, not from storage-cli's own config struct. For
# provider s3 the template reads bucket_name, aws_access_key_id, and
# aws_secret_access_key, sets credentials_source itself, and passes host, port,
# region, use_ssl, ssl_verify_peer, and host_style through when present. Using
# storage-cli's internal names (access_key_id, secret_access_key) fails at
# render time with "Can't find property cc.<bucket>.connection_config.
# aws_access_key_id", because the template never looks at them.

params:
  blobstore_s3_region:              (( vault meta.ocfp.vault.config "/cf/blobstores/main:region" ))
  blobstore_s3_host:                (( vault meta.ocfp.vault.config "/cf/blobstores/main:host" ))
  blobstore_s3_access_key:          (( vault meta.ocfp.vault.config "/cf/blobstores/main/creds:access_key" ))
  blobstore_s3_secret_key:          (( vault meta.ocfp.vault.config "/cf/blobstores/main/creds:secret_key" ))
  blobstore_s3_endpoint:            (( vault meta.ocfp.vault.config "/cf/blobstores/main:endpoint" ))

  # Bucket-prefix is sourced from vault (`<bloc>-ocf-cf`). The four CF
  # directory keys derive their bucket names by suffixing this prefix. These
  # names must match the buckets created by `ocfp bootstrap artifacts`
  # (artifactsBucketList in internal/bootstrap/artifacts.go).
  blobstore_bucket_prefix:          (( vault meta.ocfp.vault.config "/cf/blobstores/main:bucket" ))
  blobstore_app_packages_directory: (( concat params.blobstore_bucket_prefix "-packages" ))
  blobstore_buildpacks_directory:   (( concat params.blobstore_bucket_prefix "-buildpacks" ))
  blobstore_droplets_directory:     (( concat params.blobstore_bucket_prefix "-droplets" ))
  blobstore_resources_directory:    (( concat params.blobstore_bucket_prefix "-resource-pool" ))

bosh-variables:
  # Kept for any overlay still reading the credhub-style names.
  blobstore_s3_access_key_id:     (( grab params.blobstore_s3_access_key ))
  blobstore_s3_secret_access_key: (( grab params.blobstore_s3_secret_key ))

instance_groups:
- name: api
  jobs:
  - name: cloud_controller_ng
    properties:
      cc:
        buildpacks:
          blobstore_type: storage-cli
          blobstore_provider: s3
          connection_config:
            bucket_name:        (( grab params.blobstore_buildpacks_directory ))
            host:               (( grab params.blobstore_s3_host ))
            port:               (( grab params.blobstore_s3_port ))
            region:             (( grab params.blobstore_s3_region ))
            use_ssl:            (( grab params.blobstore_s3_use_ssl ))
            ssl_verify_peer:    (( grab params.blobstore_s3_ssl_verify_peer ))
            host_style:         (( grab params.blobstore_s3_host_style ))
            aws_access_key_id:     (( grab params.blobstore_s3_access_key ))
            aws_secret_access_key: (( grab params.blobstore_s3_secret_key ))
        droplets:
          blobstore_type: storage-cli
          blobstore_provider: s3
          connection_config:
            bucket_name:        (( grab params.blobstore_droplets_directory ))
            host:               (( grab params.blobstore_s3_host ))
            port:               (( grab params.blobstore_s3_port ))
            region:             (( grab params.blobstore_s3_region ))
            use_ssl:            (( grab params.blobstore_s3_use_ssl ))
            ssl_verify_peer:    (( grab params.blobstore_s3_ssl_verify_peer ))
            host_style:         (( grab params.blobstore_s3_host_style ))
            aws_access_key_id:     (( grab params.blobstore_s3_access_key ))
            aws_secret_access_key: (( grab params.blobstore_s3_secret_key ))
        packages:
          blobstore_type: storage-cli
          blobstore_provider: s3
          connection_config:
            bucket_name:        (( grab params.blobstore_app_packages_directory ))
            host:               (( grab params.blobstore_s3_host ))
            port:               (( grab params.blobstore_s3_port ))
            region:             (( grab params.blobstore_s3_region ))
            use_ssl:            (( grab params.blobstore_s3_use_ssl ))
            ssl_verify_peer:    (( grab params.blobstore_s3_ssl_verify_peer ))
            host_style:         (( grab params.blobstore_s3_host_style ))
            aws_access_key_id:     (( grab params.blobstore_s3_access_key ))
            aws_secret_access_key: (( grab params.blobstore_s3_secret_key ))
        resource_pool:
          blobstore_type: storage-cli
          blobstore_provider: s3
          connection_config:
            bucket_name:        (( grab params.blobstore_resources_directory ))
            host:               (( grab params.blobstore_s3_host ))
            port:               (( grab params.blobstore_s3_port ))
            region:             (( grab params.blobstore_s3_region ))
            use_ssl:            (( grab params.blobstore_s3_use_ssl ))
            ssl_verify_peer:    (( grab params.blobstore_s3_ssl_verify_peer ))
            host_style:         (( grab params.blobstore_s3_host_style ))
            aws_access_key_id:     (( grab params.blobstore_s3_access_key ))
            aws_secret_access_key: (( grab params.blobstore_s3_secret_key ))
