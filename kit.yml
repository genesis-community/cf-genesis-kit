---
name:    cf
version: 3.0.3
authors: [ Dennis Bell <dennis@rubidiumstudios.com> ]
docs:    https://github.com/genesis-community/cf-genesis-kit
code:    https://github.com/genesis-community/cf-genesis-kit

description: |
  This kit will deploy OSS Cloud Foundry to BOSH. It is a wrapper around the
  de-facto community standard [cf-deployment](https://github.com/cloudfoundry/cf-deployment) repository.

  It also contains convenience functions for inter-kit communication and add-on
  routines for common activities.

required_configs:
  - cloud
  - runtime

genesis_version_min: 3.1.0
secrets_store: credhub

supports:
- aws
- openstack
- stackit

credentials:
  stratos-integration:
    stratos:
      session_store: random 64 allowed-chars 0-9a-f fixed

