---
meta:
  stratos_domain: (( concat "console." params.apps_domain ))
  stratos_system_domain: (( concat "console." params.system_domain ))
  # The console is reachable both on its app route and on the system domain,
  # where an operator expects to find a foundation's other service interfaces,
  # so UAA has to accept a sign-in callback from either name. A UAA client
  # takes several redirect URIs as one comma-separated string.
  stratos_redirect_uris: (( concat "https://" meta.stratos_domain "/pp/v1/auth/sso_login_callback,https://" meta.stratos_system_domain "/pp/v1/auth/sso_login_callback" ))

instance_groups:
- name: uaa
  jobs:
  - name: uaa
    properties:
      uaa:
        clients:
          stratos_client:
            authorized-grant-types: authorization_code,client_credentials,refresh_token
            redirect-uri: (( grab meta.stratos_redirect_uris ))
            autoapprove: true # Bypass users approval
            access-token-validity: 1200
            authorities: uaa.none
            override: true
            refresh-token-validity: 2592000
            scopes:
            - network.admin
            - network.write
            - cloud_controller.read
            - cloud_controller.write
            - openid,password.write
            - cloud_controller.admin
            - scim.read,scim.write
            - doppler.firehose
            - uaa.user
            - routing.router_groups.read
            - routing.router_groups.write
            - cloud_controller.admin_read_only
            - cloud_controller.global_auditor
            - perm.admin
            - clients.read
            secret: "((stratos_client_secret))"

variables:
- name: stratos_client_secret
  type: password

exodus:
  stratos_client: stratos_client
  stratos_secret: ((stratos_client_secret))

