---

# HAProxy base overlay.

params:
  internal_only_domains: []
  trusted_domain_cidrs: ~

  haproxy_instances: 2
  haproxy_vm_type:   haproxy

  # Mirror the cf_edge_network fallback in operations/rename-network-and-deployment.yml.
  # The bare word `default` here was a path reference to $.default, which does
  # not exist, so the merge failed for every environment that did not set
  # params.cf_edge_network.
  cf_lb_network: (( grab params.cf_edge_network || params.network || "cf-edge" ))
  haproxy_ips:   (( param "Please specify the IP addresses for your load balancer instances" ))

instance_groups:
  - name: router
    vm_extensions: (( empty array ))
  - name: tcp-router
    vm_extensions: (( empty array ))
  - name: scheduler
    vm_extensions: (( empty array ))

  # Append the haproxy instance group by name rather than `(( insert before
  # "router" ))`: Genesis' adaptive (multi-pass) merge re-applies this fragment,
  # and the non-idempotent `(( insert ))` then fails with "new list entry 'name:
  # haproxy' is detected multiple times". A by-name entry merges idempotently;
  # instance-group order is irrelevant to BOSH.
  - name: haproxy
    instances: (( grab params.haproxy_instances ))
    vm_type:   (( grab params.haproxy_vm_type ))
    azs:       (( grab meta.azs ))

    stemcell: default
    networks:
      - name:       (( grab params.cf_lb_network ))
        static_ips: (( grab params.haproxy_ips ))

    vm_extensions:
      - cf-router-network-properties
      - cf-tcp-router-network-properties
      - diego-ssh-proxy-network-properties

    jobs:
      - name: haproxy
        release: haproxy

        properties:
          ha_proxy:
            tcp_link_port: 2222
            internal_only_domains: (( grab params.internal_only_domains ))
            trusted_domain_cidrs:  (( grab params.trusted_domain_cidrs ))
            ssl_pem: ~

releases:
  - name:    haproxy
    version: 17.0.1+3.2.26
    url:     https://bosh.io/d/github.com/cloudfoundry-incubator/haproxy-boshrelease?v=17.0.1%2B3.2.26
    sha1:    sha256:3aa2e1743747a09e1dcca4b5e6641bf569ea132ecce3e757d8f0bd7a926f80ff
