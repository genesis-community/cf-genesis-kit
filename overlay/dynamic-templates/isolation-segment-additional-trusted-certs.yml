params:
  isolation_segments:
  - name: {{segment-name}}
    base_trusted_certs:
    - ((diego_instance_identity_ca.ca))
    - ((credhub_tls.ca))
    - ((uaa_ssl.ca))
    additional_trusted_certs:
    - (( append ))
    # A grab that names several paths copies any list entry that is still an
    # operator, such as the vault calls in ocfp/trust-org-ca.yml, without
    # evaluating it. Grabbing the list on its own here makes spruce resolve
    # those entries before the combined grabs below read them.
    ocfp_trusted_certs: (( defer grab meta.ocfp.certs.trusted ))

# Default to empty if not ocfp
meta:
  ocfp:
    certs:
      trusted:
      - ((append))

instance_groups:
- name: (( grab meta.name ))
  jobs:
  - name: cflinuxfs4-rootfs-setup
    properties:
      cflinuxfs4-rootfs:
        trusted_certs: (( defer grab params.isolation_segments.{{segment-name}}.base_trusted_certs params.isolation_segments.{{segment-name}}.ocfp_trusted_certs params.isolation_segments.{{segment-name}}.additional_trusted_certs ))
  - name: rep
    properties:
      containers:
        trusted_ca_certificates: (( defer grab params.isolation_segments.{{segment-name}}.base_trusted_certs params.isolation_segments.{{segment-name}}.ocfp_trusted_certs params.isolation_segments.{{segment-name}}.additional_trusted_certs ))
