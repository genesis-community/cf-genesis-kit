---
# The per-segment additional-trusted-certs fragment defers
# `grab meta.ocfp.certs.trusted` into the deployment manifest, but the inner
# spruce merge that builds that fragment runs with `--prune meta`, so the
# fragment's own default for the path never reaches this merge. An OCFP
# environment fills the list from ocfp/trust-org-ca.yml and its siblings only
# when it trusts at least one CA, and a classic one has nothing defining it,
# so without this the deferred grab fails the merge. Declare it empty here so
# the grab resolves to the segment's own base and additional certificates.
# Merging an empty list leaves any certificates those overlays added intact.
meta:
  ocfp:
    certs:
      trusted: []
