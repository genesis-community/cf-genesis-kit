---
# PVE external blobstore overlay — wires CF to an S3-compatible endpoint
# (RustFS, MinIO, or any other) provisioned outside CF on the same bloc.
#
# cf-deployment v59.0.0 moved cloud_controller off the fog gem and onto
# storage-cli, and it removed the fog_connection wiring from
# operations/use-external-blobstore.yml at the same time. That ops file now
# sets only the four directory keys, so everything about how to reach the
# blobstore has to come from us. This file declares the knobs and their
# defaults; the OCFP-layer overlay at ocfp/pve/external-blobstore.yml fills in
# the host, region, and credentials from the bloc's vault tree and does the
# actual wiring onto the three cloud_controller jobs.
#
# storage-cli takes a host and a port rather than an endpoint URL, and it has
# no ssl_ca_file knob, so it verifies against the VM's system trust store. The
# bloc's internal CA reaches that store through the os-conf ca_certs runtime
# config, which is what makes ssl_verify_peer usable here.

params:
  blobstore_s3_host:   (( param "blobstore_s3_host must come from ocfp/pve/external-blobstore.yml — populate secret/config/<bloc>/ocf/cf/blobstores/main:host" ))
  blobstore_s3_region: (( param "blobstore_s3_region must come from ocfp/pve/external-blobstore.yml — populate secret/config/<bloc>/ocf/cf/blobstores/main:region" ))

  # Defaults for the parts of the endpoint that `ocfp bootstrap artifacts` does
  # not write as discrete vault keys. It writes `endpoint` as a full URL and
  # `host` on its own, so a bloc whose blobstore listens somewhere other than
  # https on 9000 has to override these two from its env file.
  blobstore_s3_port:            9000
  blobstore_s3_use_ssl:         true
  blobstore_s3_ssl_verify_peer: true

  # storage-cli names this the other way round from fog. path_style true is the
  # same thing as host_style false, and every S3-compatible blobstore we run in
  # a bloc wants path style, because a virtual-host bucket needs wildcard DNS
  # the lab does not have.
  blobstore_s3_host_style: false
