          query: '*'
      - domain: cc-uploader.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: api
          network: default
          query: '*'
      - domain: cloud-controller-ng.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: api
          network: default
          query: '*'
      - domain: credhub.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: credhub
          network: default
          query: '*'
      - domain: doppler.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: doppler
          network: default
          query: '*'
      - domain: log-cache.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: log-cache
          network: default
          query: '*'
      - domain: file-server.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: api
          network: default
          query: '*'
      - domain: gorouter.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: router
          network: default
          query: '*'
      - domain: locket.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: diego-api
          network: default
          query: '*'
      - domain: loggregator-trafficcontroller.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: log-api
          network: default
          query: '*'
      - domain: nats.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: nats
          network: default
          query: '*'
      - domain: _.nats.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: nats
          network: default
          query: _
      - domain: policy-server.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: api
          network: default
          query: '*'
      - domain: reverse-log-proxy.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: log-api
          network: default
          query: '*'
      - domain: routing-api.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: api
          network: default
          query: '*'
      - domain: silk-controller.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: diego-api
          network: default
          query: '*'
      - domain: sql-db.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: database
          network: default
          query: '*'
      - domain: ssh-proxy.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: scheduler
          network: default
          query: '*'
      - domain: tps.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
          instance_group: scheduler
          network: default
          query: '*'
      - domain: uaa.service.cf.internal
        targets:
        - deployment: compiled-windows-releases-cf
          domain: bosh
