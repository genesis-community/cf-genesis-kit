          port: 3306
          tls_ca: <!{credhub}:mysql_server_certificate.ca!>
          type: mysql
          username: credhub
        encryption:
          keys:
          - active: true
            key_properties:
              encryption_password: <!{credhub}:credhub_encryption_password!>
            provider_name: internal-provider
          providers:
          - name: internal-provider
            type: internal
        internal_url: https://credhub.service.cf.internal
