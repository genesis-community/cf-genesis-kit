      cni_config_dir: /var/vcap/jobs/silk-cni/config/cni
      cni_plugin_dir: /var/vcap/packages/silk-cni/bin
    release: cf-networking
  - consumes:
      iptables:
        from: iptables-nfs-group
    name: netmon
    release: silk
  - consumes:
      cni_config:
        from: cni_config-nfs-group
      iptables:
        from: iptables-nfs-group
    name: vxlan-policy-agent
    properties:
      ca_cert: <!{credhub}:network_policy_client.ca!>
      client_cert: <!{credhub}:network_policy_client.certificate!>
      client_key: <!{credhub}:network_policy_client.private_key!>
      loggregator:
        app_metric_exclusion_filter:
        - absolute_entitlement
        - absolute_usage
        ca_cert: <!{credhub}:loggregator_tls_agent.ca!>
        cert: <!{credhub}:loggregator_tls_agent.certificate!>
        key: <!{credhub}:loggregator_tls_agent.private_key!>
    provides:
      vpa:
        as: vpa-nfs-group
    release: silk
  - consumes:
      iptables:
        from: iptables-nfs-group
      vpa:
        from: vpa-nfs-group
    name: silk-daemon
    properties:
      ca_cert: <!{credhub}:silk_daemon.ca!>
      client_cert: <!{credhub}:silk_daemon.certificate!>
      client_key: <!{credhub}:silk_daemon.private_key!>
    release: silk
  - consumes:
      vpa:
        from: vpa-nfs-group
    name: silk-cni
    properties:
      dns_servers:
      - 169.254.0.53
    provides:
      cni_config:
        as: cni_config-nfs-group
    release: silk
  - name: loggr-udp-forwarder
    properties:
      loggregator:
        tls:
          ca: <!{credhub}:loggregator_tls_agent.ca!>
          cert: <!{credhub}:loggregator_tls_agent.certificate!>
          key: <!{credhub}:loggregator_tls_agent.private_key!>
      metrics:
        ca_cert: <!{credhub}:loggr_udp_forwarder_tls.ca!>
        cert: <!{credhub}:loggr_udp_forwarder_tls.certificate!>
        key: <!{credhub}:loggr_udp_forwarder_tls.private_key!>
        server_name: loggr_udp_forwarder_metrics
    release: loggregator-agent
  - name: bosh-dns-adapter
    properties:
      dnshttps:
        client:
          tls:
            ca: <!{credhub}:cf_app_sd_client_tls.ca!>
            certificate: <!{credhub}:cf_app_sd_client_tls.certificate!>
            private_key: <!{credhub}:cf_app_sd_client_tls.private_key!>
        server:
          ca: <!{credhub}:cf_app_sd_server_tls.ca!>
      internal_domains:
      - apps.internal.
    release: cf-networking
  - name: cflinuxfs4-rootfs-setup
    properties:
      cflinuxfs4-rootfs:
        trusted_certs:
        - <!{credhub}:diego_instance_identity_ca.ca!>
        - <!{credhub}:credhub_tls.ca!>
        - <!{credhub}:uaa_ssl.ca!>
        - test-org-ca-certificate
    release: cflinuxfs4
  - name: cflinuxfs5-rootfs-setup
    properties:
      cflinuxfs5-rootfs:
        trusted_certs:
        - <!{credhub}:diego_instance_identity_ca.ca!>
        - <!{credhub}:credhub_tls.ca!>
        - <!{credhub}:uaa_ssl.ca!>
        - test-org-ca-certificate
    release: cflinuxfs5
  - name: garden
    properties:
      garden:
        cleanup_process_dirs_on_wait: true
        containerd_mode: true
        default_container_grace_time: 0
        deny_networks:
        - 0.0.0.0/0
        destroy_containers_on_start: true
        graph_cleanup_threshold_in_mb: 0
        network_plugin: /var/vcap/packages/runc-cni/bin/garden-external-networker
        network_plugin_extra_args:
        - --configFile=/var/vcap/jobs/garden-cni/config/adapter.json
      logging:
        format:
          timestamp: rfc3339
    provides:
      iptables:
        as: iptables-nfs-group
    release: garden-runc
  - name: rep
    properties:
      bpm:
        enabled: true
      containers:
        proxy:
          enabled: true
          require_and_verify_client_certificates: true
          trusted_ca_certificates:
          - <!{credhub}:gorouter_backend_tls.ca!>
          - <!{credhub}:ssh_proxy_backends_tls.ca!>
          verify_subject_alt_name:
          - gorouter.service.cf.internal
          - ssh-proxy.service.cf.internal
        trusted_ca_certificates:
        - <!{credhub}:diego_instance_identity_ca.ca!>
        - <!{credhub}:credhub_tls.ca!>
        - <!{credhub}:uaa_ssl.ca!>
        - test-org-ca-certificate
      diego:
        executor:
          instance_identity_ca_cert: <!{credhub}:diego_instance_identity_ca.certificate!>
          instance_identity_key: <!{credhub}:diego_instance_identity_ca.private_key!>
        rep:
          placement_tags:
          - nfs-group
          preloaded_rootfses:
          - cflinuxfs4:/var/vcap/packages/cflinuxfs4/rootfs.tar
          - cflinuxfs5:/var/vcap/packages/cflinuxfs5/rootfs.tar
      enable_consul_service_registration: false
      enable_declarative_healthcheck: true
      logging:
        format:
          timestamp: rfc3339
      loggregator:
        ca_cert: <!{credhub}:loggregator_tls_agent.ca!>
        cert: <!{credhub}:loggregator_tls_agent.certificate!>
        key: <!{credhub}:loggregator_tls_agent.private_key!>
      tls:
        ca_cert: <!{credhub}:diego_rep_agent_v2.ca!>
        cert: <!{credhub}:diego_rep_agent_v2.certificate!>
        key: <!{credhub}:diego_rep_agent_v2.private_key!>
    release: diego
  - consumes:
      nats-tls:
        ip_addresses: false
    name: route_emitter
    properties:
      bpm:
        enabled: true
      diego:
        route_emitter:
          bbs:
            ca_cert: <!{credhub}:diego_bbs_client.ca!>
            client_cert: <!{credhub}:diego_bbs_client.certificate!>
            client_key: <!{credhub}:diego_bbs_client.private_key!>
          local_mode: true
          nats:
            tls:
              client_cert: <!{credhub}:nats_client_cert.certificate!>
              client_key: <!{credhub}:nats_client_cert.private_key!>
              enabled: true
      internal_routes:
        enabled: true
      logging:
        format:
          timestamp: rfc3339
      loggregator:
        ca_cert: <!{credhub}:loggregator_tls_agent.ca!>
        cert: <!{credhub}:loggregator_tls_agent.certificate!>
        key: <!{credhub}:loggregator_tls_agent.private_key!>
      tcp:
        enabled: true
      uaa:
        ca_cert: <!{credhub}:uaa_ssl.ca!>
        client_secret: <!{credhub}:uaa_clients_tcp_emitter_secret!>
    release: diego
  - name: nfsv3driver
    properties:
      nfsv3driver:
        allowed-in-source: ""
        ldap_ca_cert: <!{meta.vault}/nfs/ldap:ca!>
        ldap_host: <!{meta.vault}/nfs/ldap:host!>
        ldap_port: <!{meta.vault}/nfs/ldap:port!>
        ldap_proto: <!{meta.vault}/nfs/ldap:proto!>
        ldap_svc_password: <!{meta.vault}/nfs/ldap:pass!>
        ldap_svc_user: <!{meta.vault}/nfs/ldap:user!>
        ldap_user_fqdn: <!{meta.vault}/nfs/ldap:fqdn!>
        tls:
          ca_cert: <!{credhub}:nfsv3driver_cert.ca!>
          client_cert: <!{credhub}:nfsv3driver_client_cert.certificate!>
          client_key: <!{credhub}:nfsv3driver_client_cert.private_key!>
          server_cert: <!{credhub}:nfsv3driver_cert.certificate!>
          server_key: <!{credhub}:nfsv3driver_cert.private_key!>
    release: nfs-volume
  name: nfs-group
  networks:
  - name: ocfp-nfs-ldap-isolation-segments.cf.net-ocf
  stemcell: default
  vm_extensions:
  - 100GB_ephemeral_disk
  vm_type: ocfp-nfs-ldap-isolation-segments.cf.vm-diego-cell
